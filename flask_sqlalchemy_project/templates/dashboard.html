<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>
    <h2>Dashboard</h2>
    <a href="/add">Add User</a> | <a href="/logout">Logout</a>
    <ul>
        {% for user in users %}
            <li>{{ user.username }} - <a href="/edit/{{user.id}}">Edit</a> | <a href="/delete/{{user.id}}">Delete</a></li>
        {% endfor %}
    </ul>
</body>
</html>
